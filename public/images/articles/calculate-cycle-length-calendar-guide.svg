<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FFE8EF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E8C" />
      <stop offset="100%" stop-color="#FF8C69" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF5E8C" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="24" />

  <!-- Top Title Bar -->
  <rect x="40" y="30" width="720" height="60" rx="16" fill="#FFFFFF" filter="url(#shadow)" />
  <circle cx="70" cy="60" r="14" fill="#FF5E8C" />
  <path d="M65 60 L69 64 L76 56" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <text x="96" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1A1819">How to Count Cycle Length: Day 1 to Next Day 1</text>
  <text x="630" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FF5E8C">28-DAY EXAMPLE</text>

  <!-- Calendar Month 1 Box -->
  <rect x="40" y="110" width="345" height="230" rx="20" fill="#FFFFFF" filter="url(#shadow)" />
  <rect x="40" y="110" width="345" height="45" rx="20" fill="#FFF0F4" />
  <text x="60" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FF5E8C">Cycle Month 1</text>
  <text x="260" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#706B6E">Start: Day 1</text>

  <!-- Day 1 Highlight Pin -->
  <rect x="60" y="175" width="70" height="70" rx="16" fill="url(#accentGrad)" />
  <text x="95" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">MAY 1</text>
  <text x="95" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">DAY 1 (LMP)</text>

  <!-- Flow Days 2-5 -->
  <rect x="145" y="185" width="45" height="50" rx="10" fill="#FFE5EC" />
  <text x="167" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FF5E8C" text-anchor="middle">May 2</text>
  <rect x="200" y="185" width="45" height="50" rx="10" fill="#FFE5EC" />
  <text x="222" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FF5E8C" text-anchor="middle">May 3</text>
  <rect x="255" y="185" width="45" height="50" rx="10" fill="#FFE5EC" />
  <text x="277" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FF5E8C" text-anchor="middle">May 4</text>
  <rect x="310" y="185" width="45" height="50" rx="10" fill="#FFE5EC" />
  <text x="332" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FF5E8C" text-anchor="middle">May 5</text>

  <!-- Month 1 Note -->
  <text x="60" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1A1819">Full Bleeding Days: 5 Days</text>
  <text x="60" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#706B6E">Counting starts on the FIRST day of real red blood flow</text>
  <text x="60" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#A0989B">Do not count light pre-period brown spotting as Day 1</text>

  <!-- Cycle Month 2 Box -->
  <rect x="415" y="110" width="345" height="230" rx="20" fill="#FFFFFF" filter="url(#shadow)" />
  <rect x="415" y="110" width="345" height="45" rx="20" fill="#FFF0F4" />
  <text x="435" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FF5E8C">Cycle Month 2</text>
  <text x="635" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#706B6E">Next Day 1</text>

  <!-- Day 29 Highlight Pin -->
  <rect x="435" y="175" width="80" height="70" rx="16" fill="url(#accentGrad)" />
  <text x="475" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">MAY 29</text>
  <text x="475" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">NEXT DAY 1</text>

  <rect x="530" y="175" width="210" height="70" rx="16" fill="#F8F6F7" />
  <text x="545" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Total Counted Days:</text>
  <text x="545" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FF5E8C">28 Days Exactly</text>

  <!-- Month 2 Note -->
  <text x="435" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1A1819">Normal Clinical Cycle Range:</text>
  <text x="435" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#706B6E">21 to 35 Days is healthy for 85%+ of women</text>
  <text x="435" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#A0989B">Variation of 2–4 days between months is completely normal</text>

  <!-- Bottom Formula Banner -->
  <rect x="40" y="360" width="720" height="65" rx="18" fill="#FFFFFF" filter="url(#shadow)" />
  <text x="70" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1A1819">Golden Formula:</text>
  <text x="185" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FF5E8C">Cycle Length = (Date of Next Period Day 1) MINUS (Date of Previous Period Day 1)</text>
</svg>
