<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3" />
      <stop offset="100%" stop-color="#FFE4EA" />
    </linearGradient>
    <linearGradient id="curve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E8C" />
      <stop offset="50%" stop-color="#E03668" />
      <stop offset="100%" stop-color="#9B1C48" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="24" fill="url(#bg)" />

  <!-- Grid Card -->
  <rect x="40" y="30" width="720" height="390" rx="18" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Header -->
  <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#1A1819">Beta hCG Doubling Curve &amp; Reference Levels</text>
  <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FF5E8C">EARLY PREGNANCY HORMONAL MONITORING GUIDE</text>

  <!-- Graph Axes -->
  <line x1="100" y1="360" x2="700" y2="360" stroke="#E2E8F0" stroke-width="2" />
  <line x1="100" y1="120" x2="100" y2="360" stroke="#E2E8F0" stroke-width="2" />

  <!-- Y-Axis Labels (mIU/mL) -->
  <text x="90" y="365" text-anchor="end" font-family="sans-serif" font-size="11" fill="#706B6E">0</text>
  <text x="90" y="300" text-anchor="end" font-family="sans-serif" font-size="11" fill="#706B6E">1,000</text>
  <text x="90" y="240" text-anchor="end" font-family="sans-serif" font-size="11" fill="#706B6E">6,000</text>
  <text x="90" y="180" text-anchor="end" font-family="sans-serif" font-size="11" fill="#706B6E">20,000</text>
  <text x="90" y="125" text-anchor="end" font-family="sans-serif" font-size="11" fill="#706B6E">100,000</text>

  <!-- X-Axis Labels (Gestational Weeks) -->
  <text x="140" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1A1819">3 Wks</text>
  <text x="220" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1A1819">4 Wks</text>
  <text x="300" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1A1819">5 Wks</text>
  <text x="380" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1A1819">6 Wks</text>
  <text x="460" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1A1819">8 Wks (Peak)</text>
  <text x="540" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1A1819">10 Wks</text>
  <text x="640" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1A1819">12-14 Wks</text>

  <!-- Curve Path -->
  <path d="M 120 355 Q 220 345, 300 300 T 380 220 T 460 140 Q 520 150, 580 180 T 680 210" fill="none" stroke="url(#curve)" stroke-width="4" stroke-linecap="round" />

  <!-- Data Points -->
  <circle cx="220" cy="345" r="5" fill="#FF5E8C" />
  <circle cx="300" cy="300" r="5" fill="#FF5E8C" />
  <circle cx="380" cy="220" r="5" fill="#E03668" />
  <circle cx="460" cy="140" r="6" fill="#9B1C48" />

  <!-- Ultrasound Threshold Marker -->
  <line x1="100" y1="285" x2="700" y2="285" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4" />
  <rect x="520" y="270" width="165" height="24" rx="6" fill="#CCFBF1" />
  <text x="602" y="286" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0F766E">Ultrasound Sac (1,500 mIU/mL)</text>

  <!-- Callout Cards -->
  <rect x="120" y="105" width="220" height="48" rx="8" fill="#FFF1F2" stroke="#FFE4E6" />
  <text x="130" y="123" font-family="sans-serif" font-size="10" font-weight="700" fill="#9F1239">Doubling Speed Rule:</text>
  <text x="130" y="140" font-family="sans-serif" font-size="9.5" fill="#4C0519">&lt; 1,200 mIU/mL: Doubles in 48-72h</text>
</svg>
