<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFE4EE" />
    </linearGradient>
    <linearGradient id="fertileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E8C" />
      <stop offset="100%" stop-color="#FF8C69" />
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF5E8C" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)" rx="24" />

  <!-- Header -->
  <rect x="40" y="25" width="720" height="60" rx="16" fill="#FFFFFF" filter="url(#softShadow)" />
  <circle cx="70" cy="55" r="14" fill="#FF5E8C" />
  <circle cx="70" cy="55" r="6" fill="#FFFFFF" />
  <text x="96" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1A1819">The 6-Day Fertile Window &amp; Ovulation Surge Timeline</text>
  <text x="640" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10B981">PEAK CONCEPTION</text>

  <!-- Cycle Timeline Graphic -->
  <rect x="40" y="105" width="720" height="210" rx="20" fill="#FFFFFF" filter="url(#softShadow)" />

  <!-- Timeline Bar Background -->
  <rect x="70" y="145" width="660" height="16" rx="8" fill="#F1ECEE" />

  <!-- Fertile Window Span (Day 9 to Day 14) -->
  <rect x="290" y="141" width="310" height="24" rx="12" fill="url(#fertileGrad)" opacity="0.3" />
  <rect x="520" y="137" width="80" height="32" rx="16" fill="url(#peakGrad)" />

  <!-- Days Markers -->
  <!-- Follicular Days 1-8 -->
  <circle cx="110" cy="153" r="12" fill="#E5E0E2" />
  <text x="110" y="157" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#706B6E" text-anchor="middle">1</text>
  <text x="110" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#706B6E" text-anchor="middle">Period</text>

  <!-- Fertile Open (Day 10) -->
  <circle cx="310" cy="153" r="14" fill="#10B981" />
  <text x="310" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">10</text>
  <text x="310" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Window Opens</text>
  <text x="310" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#706B6E" text-anchor="middle">Creamy Fluid</text>

  <!-- High Fertility (Day 12-13) -->
  <circle cx="440" cy="153" r="16" fill="#10B981" />
  <text x="440" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">13</text>
  <text x="440" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">High Fertility</text>
  <text x="440" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#706B6E" text-anchor="middle">Watery / Stretchy</text>

  <!-- Peak Ovulation (Day 14) -->
  <circle cx="560" cy="153" r="20" fill="#FF5E8C" />
  <text x="560" y="159" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">14</text>
  <text x="560" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#FF5E8C" text-anchor="middle">OVULATION</text>
  <text x="560" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#1A1819" text-anchor="middle">Egg-White Mucus</text>

  <!-- Post-Ovulation (Day 16+) -->
  <circle cx="690" cy="153" r="12" fill="#E5E0E2" />
  <text x="690" y="157" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#706B6E" text-anchor="middle">16</text>
  <text x="690" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#706B6E" text-anchor="middle">Luteal Phase</text>
  <text x="690" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#706B6E" text-anchor="middle">BBT Rises 0.5°F</text>

  <!-- Key Biological Markers Checklist -->
  <rect x="70" y="225" width="660" height="70" rx="14" fill="#FFF8FA" />
  <text x="90" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FF5E8C">PRIMARY SIGNS:</text>
  <text x="195" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#1A1819">1. Raw egg-white cervical fluid</text>
  <text x="390" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#1A1819">2. Positive urine LH surge strip</text>
  <text x="575" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#1A1819">3. Mittelschmerz twinge</text>

  <text x="90" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FF5E8C">SECONDARY SIGNS:</text>
  <text x="210" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#706B6E">Heightened libido &amp; sensory acuity</text>
  <text x="430" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#706B6E">Soft, high &amp; open cervix position</text>

  <!-- Bottom Tip -->
  <rect x="40" y="335" width="720" height="90" rx="18" fill="#FFFFFF" filter="url(#softShadow)" />
  <text x="70" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Conception Probability Tip:</text>
  <text x="70" y="388" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#706B6E">Having intercourse 1 to 2 days BEFORE ovulation yields the highest clinical pregnancy rates (up to 33%),</text>
  <text x="70" y="408" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#706B6E">because healthy sperm wait in the fallopian tube ready for the egg's 12–24 hour arrival.</text>
</svg>
