<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#bg5)" />
  <rect x="40" y="30" width="720" height="390" rx="18" fill="#FFFFFF" filter="url(#shadow5)" />

  <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#1A1819">Tracking Ovulation with Irregular Periods &amp; PCOS</text>
  <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7E22CE">ADAPTIVE MATHEMATICAL FORMULA &amp; HORMONE PROTOCOLS</text>

  <!-- Formula Box -->
  <g transform="translate(65, 115)">
    <rect width="670" height="90" rx="12" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.5" />
    <text x="25" y="30" font-family="sans-serif" font-size="12" font-weight="800" fill="#6B21A8">The Variable Cycle Mathematical Formula:</text>
    <text x="25" y="55" font-family="sans-serif" font-size="12" font-weight="700" fill="#4A044E">Earliest Fertile Day = Shortest Cycle Length − 18 Days</text>
    <text x="25" y="75" font-family="sans-serif" font-size="12" font-weight="700" fill="#4A044E">Latest Fertile Day = Longest Cycle Length − 11 Days</text>
  </g>

  <!-- 3 Tracking Pillars -->
  <g transform="translate(65, 225)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="210" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="35" cy="35" r="16" fill="#A855F7" />
    <text x="35" y="40" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">1</text>
    <text x="65" y="39" font-family="sans-serif" font-size="12" font-weight="800" fill="#1E293B">BBT Thermal Shift</text>
    <text x="15" y="75" font-family="sans-serif" font-size="10" fill="#475569">• Progesterone causes a sustained</text>
    <text x="15" y="92" font-family="sans-serif" font-size="10" fill="#475569">  0.5°F rise confirming ovulation.</text>
    <text x="15" y="112" font-family="sans-serif" font-size="10" fill="#475569">• Bypasses false LH urine spikes</text>
    <text x="15" y="129" font-family="sans-serif" font-size="10" fill="#475569">  frequently seen with PCOS.</text>

    <!-- Pillar 2 -->
    <rect x="230" y="0" width="210" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="265" cy="35" r="16" fill="#A855F7" />
    <text x="265" y="40" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">2</text>
    <text x="295" y="39" font-family="sans-serif" font-size="12" font-weight="800" fill="#1E293B">Cervical Mucus</text>
    <text x="245" y="75" font-family="sans-serif" font-size="10" fill="#475569">• Estrogen surges trigger clear,</text>
    <text x="245" y="92" font-family="sans-serif" font-size="10" fill="#475569">  stretchy "egg-white" fluid.</text>
    <text x="245" y="112" font-family="sans-serif" font-size="10" fill="#475569">• High fertile probability regardless</text>
    <text x="245" y="129" font-family="sans-serif" font-size="10" fill="#475569">  of calendar cycle day count.</text>

    <!-- Pillar 3 -->
    <rect x="460" y="0" width="210" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="495" cy="35" r="16" fill="#A855F7" />
    <text x="495" y="40" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">3</text>
    <text x="525" y="39" font-family="sans-serif" font-size="12" font-weight="800" fill="#1E293B">Adaptive Logging</text>
    <text x="475" y="75" font-family="sans-serif" font-size="10" fill="#475569">• Log at least 3-6 cycles in app.</text>
    <text x="475" y="92" font-family="sans-serif" font-size="10" fill="#475569">• Multi-parameter AI prediction</text>
    <text x="475" y="112" font-family="sans-serif" font-size="10" fill="#475569">  calibrates to your body's</text>
    <text x="475" y="129" font-family="sans-serif" font-size="10" fill="#475569">  unique follicular variations.</text>
  </g>
</svg>
