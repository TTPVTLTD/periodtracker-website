<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FFE8EF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF9FA" />
    </linearGradient>
    <linearGradient id="lmpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E8C" />
      <stop offset="100%" stop-color="#FF8C69" />
    </linearGradient>
    <linearGradient id="conceptionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#845EC2" />
      <stop offset="100%" stop-color="#D65DB1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5E8C" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="16" />

  <!-- Header Title -->
  <text x="400" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#1A1819">
    Due Date Calculation: Conception vs. LMP Method
  </text>
  <text x="400" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#706B6E">
    Naegele's Rule (40 Weeks / 280 Days) vs. True Fetal Age (38 Weeks / 266 Days)
  </text>

  <!-- Method 1: LMP Card -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="345" height="295" rx="14" fill="url(#cardGrad)" stroke="#FFD1DC" stroke-width="1.5" />
    
    <rect x="20" y="20" width="305" height="34" rx="8" fill="url(#lmpGrad)" />
    <text x="172" y="43" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
      Method 1: Last Menstrual Period (LMP)
    </text>

    <!-- Details -->
    <text x="30" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Calculation Formula:</text>
    <rect x="30" y="95" width="285" height="36" rx="6" fill="#FFF0F4" stroke="#FFB6C1" stroke-width="1" />
    <text x="172" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FF5E8C">
      LMP Date + 280 Days (40 Weeks)
    </text>

    <text x="30" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1A1819">• Standard Clinical Convention (Naegele's Rule)</text>
    <text x="30" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#555">• Assumes a standard 28-day cycle with Day 14 ovulation</text>
    <text x="30" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#555">• Includes the 2 weeks before conception occurs</text>
    <text x="30" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#555">• May miscalculate by 4-8 days in irregular cycles</text>

    <rect x="30" y="244" width="285" height="32" rx="6" fill="#FFF5F7" />
    <text x="172" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF5E8C">
      Gestational Age: Includes 2 Weeks Pre-Conception
    </text>
  </g>

  <!-- Method 2: Conception Date Card -->
  <g transform="translate(415, 105)" filter="url(#shadow)">
    <rect width="345" height="295" rx="14" fill="url(#cardGrad)" stroke="#E5D4F5" stroke-width="1.5" />
    
    <rect x="20" y="20" width="305" height="34" rx="8" fill="url(#conceptionGrad)" />
    <text x="172" y="43" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
      Method 2: Exact Conception Date
    </text>

    <!-- Details -->
    <text x="30" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Calculation Formula:</text>
    <rect x="30" y="95" width="285" height="36" rx="6" fill="#F8F2FF" stroke="#D1B3FF" stroke-width="1" />
    <text x="172" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#845EC2">
      Conception Date + 266 Days (38 Weeks)
    </text>

    <text x="30" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1A1819">• Based on Exact Ovulation or Intercourse Date</text>
    <text x="30" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#555">• True embryonic development timeline (fetal age)</text>
    <text x="30" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#555">• Perfect for irregular cycles, PCOS, or IVF transfers</text>
    <text x="30" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#555">• Egg fertilizes within 12-24 hours post-ovulation</text>

    <rect x="30" y="244" width="285" height="32" rx="6" fill="#FBF7FF" />
    <text x="172" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#845EC2">
      Fetal Age: Pure Biological Developmental Time
    </text>
  </g>

  <!-- Watermark / Brand Badge -->
  <text x="400" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#A89FA3">
    Period Tracker &amp; Ovulation Cycle • Clinical Health Library (trackperiods.com)
  </text>
</svg>
