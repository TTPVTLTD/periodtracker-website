<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FDF2F4" />
    </linearGradient>
    <linearGradient id="spottingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="periodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad5)" rx="24" />

  <!-- Header -->
  <rect x="40" y="25" width="720" height="60" rx="16" fill="#FFFFFF" filter="url(#boxShadow)" />
  <circle cx="70" cy="55" r="14" fill="#DC2626" />
  <circle cx="70" cy="55" r="6" fill="#FFFFFF" />
  <text x="96" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1A1819">Spotting vs Period: Visual &amp; Flow Comparison Guide</text>
  <text x="640" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#DC2626">CLINICAL GUIDE</text>

  <!-- Left Card: Spotting -->
  <rect x="40" y="105" width="345" height="235" rx="20" fill="#FFFFFF" filter="url(#boxShadow)" />
  <rect x="40" y="105" width="345" height="45" rx="20" fill="#FEF3C7" />
  <text x="60" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#B45309">SPOTTING (Light Bleed)</text>

  <!-- Spotting Attributes -->
  <circle cx="75" cy="180" r="12" fill="#FDE68A" />
  <circle cx="75" cy="180" r="6" fill="#D97706" />
  <text x="100" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Color: Pink, Light Brown, or Rusty</text>

  <circle cx="75" cy="220" r="12" fill="#FDE68A" />
  <circle cx="75" cy="220" r="6" fill="#D97706" />
  <text x="100" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Flow: Only droplets; panty liner is enough</text>

  <circle cx="75" cy="260" r="12" fill="#FDE68A" />
  <circle cx="75" cy="260" r="6" fill="#D97706" />
  <text x="100" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Duration: 1 to 3 days (does not fill pads)</text>

  <circle cx="75" cy="300" r="12" fill="#FDE68A" />
  <circle cx="75" cy="300" r="6" fill="#D97706" />
  <text x="100" y="305" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Causes: Ovulation, implantation, early pill</text>

  <!-- Right Card: Menstrual Period -->
  <rect x="415" y="105" width="345" height="235" rx="20" fill="#FFFFFF" filter="url(#boxShadow)" />
  <rect x="415" y="105" width="345" height="45" rx="20" fill="#FEE2E2" />
  <text x="435" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#DC2626">TRUE PERIOD (Full Flow)</text>

  <!-- Period Attributes -->
  <circle cx="450" cy="180" r="12" fill="#FECACA" />
  <circle cx="450" cy="180" r="6" fill="#DC2626" />
  <text x="475" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Color: Vibrant Bright Red to Deep Crimson</text>

  <circle cx="450" cy="220" r="12" fill="#FECACA" />
  <circle cx="450" cy="220" r="6" fill="#DC2626" />
  <text x="475" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Flow: Steady stream; requires regular pads</text>

  <circle cx="450" cy="260" r="12" fill="#FECACA" />
  <circle cx="450" cy="260" r="6" fill="#DC2626" />
  <text x="475" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Duration: 3 to 7 full bleeding days</text>

  <circle cx="450" cy="300" r="12" fill="#FECACA" />
  <circle cx="450" cy="300" r="6" fill="#DC2626" />
  <text x="475" y="305" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Causes: Progesterone drop &amp; lining shed</text>

  <!-- Bottom Implantation Summary -->
  <rect x="40" y="355" width="720" height="70" rx="18" fill="#FFFFFF" filter="url(#boxShadow)" />
  <text x="70" y="385" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1A1819">Could It Be Implantation Bleeding?</text>
  <text x="70" y="408" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#706B6E">Implantation spotting occurs 6 to 12 days after ovulation, produces faint pink or brown smears, and never includes clots or heavy flow.</text>
</svg>
