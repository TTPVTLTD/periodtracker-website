<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#bg3)" />
  <rect x="40" y="30" width="720" height="390" rx="18" fill="#FFFFFF" filter="url(#shadow3)" />

  <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#1A1819">Embryo Implantation Window &amp; Spotting Timeline</text>
  <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#EA580C">DAYS 6 TO 12 POST-OVULATION (DPO)</text>

  <!-- Timeline Stages -->
  <line x1="80" y1="210" x2="680" y2="210" stroke="#FDBA74" stroke-width="4" stroke-linecap="round" />

  <!-- Stage 1: Ovulation & Fertilization (Day 0-1) -->
  <g transform="translate(110, 160)">
    <circle cx="0" cy="50" r="14" fill="#F97316" />
    <text x="0" y="55" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">1</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1A1819">Day 0 - 1</text>
    <text x="0" y="85" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#7C2D12">Ovulation</text>
    <text x="0" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9A3412">Egg fertilized</text>
    <text x="0" y="115" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9A3412">in fallopian tube</text>
  </g>

  <!-- Stage 2: Tubal Journey (Day 2-5) -->
  <g transform="translate(250, 160)">
    <circle cx="0" cy="50" r="14" fill="#F97316" />
    <text x="0" y="55" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">2</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1A1819">Days 2 - 5</text>
    <text x="0" y="85" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#7C2D12">Cell Division</text>
    <text x="0" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9A3412">Morula transitions</text>
    <text x="0" y="115" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9A3412">into blastocyst</text>
  </g>

  <!-- Stage 3: Peak Implantation (Day 8-10) -->
  <g transform="translate(420, 140)">
    <rect x="-55" y="-10" width="110" height="175" rx="12" fill="#FFF7ED" stroke="#FB923C" stroke-width="2" />
    <circle cx="0" cy="70" r="18" fill="#C2410C" />
    <text x="0" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">★</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#9A3412">Days 8 - 10</text>
    <text x="0" y="35" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#C2410C">84% PEAK</text>
    <text x="0" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#7C2D12">Implantation</text>
    <text x="0" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9A3412">Embryo burrows</text>
    <text x="0" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9A3412">Light spotting/cramps</text>
  </g>

  <!-- Stage 4: Hormone Release (Day 11-14) -->
  <g transform="translate(590, 160)">
    <circle cx="0" cy="50" r="14" fill="#F97316" />
    <text x="0" y="55" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">4</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1A1819">Days 11 - 14</text>
    <text x="0" y="85" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#7C2D12">hCG Surges</text>
    <text x="0" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9A3412">Hormone doubles</text>
    <text x="0" y="115" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9A3412">Pregnancy test positive</text>
  </g>

  <!-- Bottom Clarification -->
  <rect x="65" y="340" width="620" height="42" rx="10" fill="#FFFBEB" stroke="#FDE68A" />
  <text x="80" y="365" font-family="sans-serif" font-size="11" font-weight="600" fill="#92400E">🔬 Clinical Fact: 84% of viable blastocyst implantations occur precisely between 8 and 10 DPO.</text>
</svg>
