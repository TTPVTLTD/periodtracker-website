<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#bg4)" />
  <rect x="40" y="30" width="720" height="390" rx="18" fill="#FFFFFF" filter="url(#shadow4)" />

  <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#1A1819">Natural Family Planning: Safe Days vs Fertile Window</text>
  <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#2563EB">STANDARD 28-DAY MENSTRUAL CYCLE BLUEPRINT</text>

  <!-- Cycle Phases Horizontal Bar -->
  <g transform="translate(65, 130)">
    <!-- Phase 1: Menstruation (Days 1-7) -->
    <rect x="0" y="0" width="160" height="110" rx="12" fill="#FEE2E2" stroke="#FCA5A5" />
    <text x="80" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#991B1B">Days 1 - 7</text>
    <text x="80" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#B91C1C">Menstruation</text>
    <text x="80" y="75" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#7F1D1D">Lower Conception Risk</text>
    <text x="80" y="90" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991B1B">(Watch short cycles!)</text>

    <!-- Phase 2: Fertile Window (Days 8-19) -->
    <rect x="175" y="-10" width="280" height="130" rx="14" fill="#FFF1F2" stroke="#FB7185" stroke-width="2" />
    <rect x="265" y="5" width="100" height="20" rx="10" fill="#E11D48" />
    <text x="315" y="19" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF">HIGH FERTILITY</text>
    <text x="315" y="48" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#9F1239">Days 8 - 19 (Unsafe)</text>
    <text x="315" y="68" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#BE123C">Peak Ovulation Window (Day 14)</text>
    <text x="315" y="90" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#881337">Sperm survives up to 5 days in cervical fluid.</text>
    <text x="315" y="105" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#BE123C">Avoid unprotected intercourse.</text>

    <!-- Phase 3: Luteal Phase (Days 20-28) -->
    <rect x="470" y="0" width="200" height="110" rx="12" fill="#ECFDF5" stroke="#6EE7B7" />
    <text x="570" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#065F46">Days 20 - 28</text>
    <text x="570" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#047857">Luteal Phase (Safe)</text>
    <text x="570" y="75" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#064E3B">Egg has dissolved.</text>
    <text x="570" y="90" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#059669">Physiologically Infertile Window</text>
  </g>

  <!-- Legend / Rules -->
  <g transform="translate(65, 280)">
    <rect width="670" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="25" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#1E293B">The Golden Rules of Natural Family Planning:</text>
    <text x="25" y="55" font-family="sans-serif" font-size="10.5" fill="#475569">1. <strong fill="#0F172A">Standard Days Method:</strong> Safe only for women with cycles consistently between 26 and 32 days long.</text>
    <text x="25" y="75" font-family="sans-serif" font-size="10.5" fill="#475569">2. <strong fill="#0F172A">Symptothermal Confirmation:</strong> Confirm ovulation with a 3-day sustained basal body temperature (BBT) shift.</text>
  </g>
</svg>
