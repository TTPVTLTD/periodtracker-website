<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#E6FFFA" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#bg2)" />
  <rect x="40" y="30" width="720" height="390" rx="18" fill="#FFFFFF" filter="url(#shadow2)" />

  <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#1A1819">Pregnancy Test Accuracy Timeline by DPO</text>
  <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0D9488">DAYS PAST OVULATION DETECTION WINDOWS</text>

  <!-- Progress Bar Container -->
  <!-- 8 DPO -->
  <g transform="translate(65, 120)">
    <rect width="140" height="190" rx="14" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="2" />
    <circle cx="70" cy="45" r="24" fill="#EF4444" />
    <text x="70" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">15%</text>
    <text x="70" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#991B1B">8 DPO</text>
    <text x="70" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#B91C1C">Too Early</text>
    <text x="70" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7F1D1D">High false negative</text>
    <text x="70" y="155" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7F1D1D">risk. Implantation</text>
    <text x="70" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7F1D1D">may just begin.</text>
  </g>

  <!-- 10 DPO -->
  <g transform="translate(225, 120)">
    <rect width="140" height="190" rx="14" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="2" />
    <circle cx="70" cy="45" r="24" fill="#F59E0B" />
    <text x="70" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">66%</text>
    <text x="70" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#92400E">10 DPO</text>
    <text x="70" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#B45309">Early Result</text>
    <text x="70" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#78350F">Faint line possible</text>
    <text x="70" y="155" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#78350F">with ultra-sensitive</text>
    <text x="70" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#78350F">10 mIU test.</text>
  </g>

  <!-- 12 DPO -->
  <g transform="translate(385, 120)">
    <rect width="140" height="190" rx="14" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="2" />
    <circle cx="70" cy="45" r="24" fill="#10B981" />
    <text x="70" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">86%</text>
    <text x="70" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#166534">12 DPO</text>
    <text x="70" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#15803D">Reliable</text>
    <text x="70" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532D">Most standard</text>
    <text x="70" y="155" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532D">tests detect hCG</text>
    <text x="70" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532D">levels accurately.</text>
  </g>

  <!-- 14 DPO -->
  <g transform="translate(545, 120)">
    <rect width="140" height="190" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2" />
    <circle cx="70" cy="45" r="24" fill="#059669" />
    <text x="70" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">99%</text>
    <text x="70" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#065F46">14 DPO</text>
    <text x="70" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#047857">Missed Period</text>
    <text x="70" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#064E3B">Gold standard day.</text>
    <text x="70" y="155" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#064E3B">Over 99% definitive</text>
    <text x="70" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#064E3B">result accuracy.</text>
  </g>

  <!-- Bottom Tip -->
  <rect x="65" y="340" width="620" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="80" y="365" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">💡 Medical Best Practice: Always test using first-morning urine for maximum hCG concentration.</text>
</svg>
